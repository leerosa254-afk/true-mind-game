<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>진짜 마음을 찾아라</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="/socket.io/socket.io.js"></script></head><body>
<main>
 <section id="lobby" class="screen active center"><div class="hero"><div class="logo">💭</div><p class="eyebrow">사회인식 × 관계기술</p><h1>진짜 마음을<br><em>찾아라!</em></h1><p>보이는 마음과 진짜 마음은 같을까?</p><div class="card form"><input id="name" maxlength="12" placeholder="이름 또는 별명"><button id="create" class="primary">교사용 방 만들기</button><div class="join"><input id="code" maxlength="4" placeholder="참여 코드"><button id="join">학생 입장</button></div></div><button id="resume" class="link hidden">진행 중인 활동으로 돌아가기</button></div></section>
 <section id="waiting" class="screen"><div class="wrap"><header class="room-head"><div><span class="eyebrow">대기실</span><h2>모두 들어왔나요?</h2></div><div class="code"><small>참여 코드</small><b id="roomCode"></b></div></header><div class="card participant-card"><h3>참가자 <span id="count"></span></h3><div id="players" class="players"></div></div><div id="teacherSetup" class="card setup hidden"><h3>활동 설정</h3><div class="setup-grid"><label>활동 시간<select id="duration"><option value="10">빠른 활동 10분</option><option value="15" selected>기본 활동 15분</option><option value="25">정규 활동 25분</option></select></label><label>진행 모드<select id="mode"><option value="mixed" selected>혼합: 캐릭터 + 친구</option><option value="character">캐릭터 모드</option><option value="friend">친구 모드</option></select></label><label>라운드<select id="rounds"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label></div><button id="start" class="primary wide">활동 시작</button></div><p id="waitText" class="waiting-text">선생님이 활동을 시작할 때까지 기다려 주세요.</p></div></section>
 <section id="game" class="screen"><div class="game-wrap"><header class="game-head"><span class="round">ROUND <b id="round"></b></span><span id="modeBadge" class="mode-badge"></span><span class="timer">⏱ <b id="timer"></b></span></header><div id="teacherBar" class="teacher-bar hidden"><span id="progress"></span><div><button id="addTime">+10초</button><button id="force">다음 단계</button><button id="end">여기서 마치기</button></div></div><div class="card scenario"><div><span id="category" class="tag"></span><h2 id="situation"></h2><p id="clue"></p></div><div id="heroName" class="hero-name"></div></div><div id="phaseArea"></div></div></section>
 <section id="finished" class="screen center finish-bg"><div class="finish"><div class="logo">🌈</div><h1>마음 탐정 활동 완료!</h1><p>추측만으로는 마음을 모두 알 수 없어요.<br>판단보다 먼저 물어봐 주세요.</p><div id="scores" class="card scores"></div><button onclick="localStorage.removeItem('trueMindSession');location.reload()" class="primary">처음으로</button></div></section>
</main><div id="toast"></div><script src="app.js"></script></body></html>
